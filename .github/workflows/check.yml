name: Check Go Project

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/data-localizer
      - run: npm run build
      - run: node tests/node/core-smoke-test.js
      - run: npm pack --dry-run
